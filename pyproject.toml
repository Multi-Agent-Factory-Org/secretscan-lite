[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secretscan_lite"
version = "0.1.0"
description = "Détecteur de motifs de secrets en ligne de commande, sans dépendance obligatoire."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "usine multi-agentique" }]
keywords = ["secrets", "securite", "scan", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "ruff>=0.6",
    "build>=1.2",
]

[project.scripts]
secretscan-lite = "secretscan_lite.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
minversion = "7.0"

[tool.coverage.run]
source = ["secretscan_lite"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
